baseURL: 'https://junho1144.github.io/Portfolio/'
title: junho portfolio
locale: ko-kr
DefaultContentLanguage: ko
enableEmoji: true
enableGitInfo: false
enableRobotsTXT: true
canonifyURLs: false
pagination:
  pagerSize: 9
darkmode_js:
  - assets/js/darkmode.js
enableInlineShortcodes: true

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: Junho
  authorimage: ../assets/images/global/author.webp
  og_image: /images/tailbliss-cover.png
  moto: "JBNU student"
  description: "This is the portfolio of Junho."
  disable_theme_toggle: false
  newsletter_signup: false

  p1:
    heading: "Let me introduce"
    image: "images/pages/our-mission.png"
    content:
      - text: "Game development is more than just a hobby for me, it is a creative outlet where I bring interactive ideas to life."
      - text: "I started developing games at the age of 12 using Scratch."
      - text: "Years later, that early curiosity has evolved into a dynamic skillset as I continue to design, program, and refine games using modern industry tools."
  p2:
    heading: "I am JBNU student."
    image: "images/pages/hacktoberfest.jpg"
    content:
      - text: "I am JBNU student. JBNU is in jeonju, korea."
      - type: "table"
        columns:
          - heading: "Column 1"
            items:
              - "Bullet point 1"
              - "Bullet point 2"
              - "Bullet point 3"
          - heading: "Column 2"
            items:
              - "Bullet point 4"
              - "Bullet point 5"
              - "Bullet point 6"
  p3:
    heading: "My Interests"
    content:
      - text: "I do programming. And I also use github."
    links:
      - text: My github
        url: "https://github.com/junho1144"

  p4:
    heading: "About, Contact, Project"
    content:
      - text: "portfolio details"
  p5:
    heading: "Stay Up to Date"
    content:
      - text: "Sagittis scelerisque nulla cursus in enim consectetur quam. Dictum urna sed consectetur neque tristique pellentesque."
    action: "#"
    label: "Email address"
    placeholder: "Enter your email"
    button: "Notify me"

  social_media:
    github:
      enabled: true
      url: 'https://github.com/junho1144'
    facebook:
      enabled: false
      url: 'https://facebook.com/nusserstudios'
    instagram:
      enabled: false
      url: 'https://instagram.com/nusserstudios'
    twitter:
      enabled: false
      url: 'https://twitter.com/nusserstudios'
    

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 10
    - identifier: prose
      name: Project
      url: /prose/
      weight: 20
    - identifier: contact
      name: Contact
      url: /contact/
      weight: 30
  footer:
    - identifier: about
      name: About
      url: /about/
      weight: 10
    - identifier: prose
      name: Project
      url: /prose/
      weight: 20
    - identifier: contact
      name: Contact
      url: /contact/
      weight: 30

taxonomies:
  category: Categories
  tag: Tags

privacy:
  disqus:
    disable: false
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: false
    useSessionStorage: false
  instagram:
    disable: false
    simple: false
  twitter:
    disable: false
    enableDNT: false
    simple: false
  vimeo:
    disable: false
    enableDNT: false
    simple: false
  youtube:
    disable: false
    privacyEnhanced: true

module:
  hugoVersion:
    extended: true
    min: "0.158.0"

# Performance optimizations
caches:
  assets:
    dir: ":cacheDir/assets"
    maxAge: "0s"
  images:
    dir: ":cacheDir/images"
    maxAge: "8760h"
  modules:
    dir: ":cacheDir/modules"
    maxAge: "8760h"

# Image processing defaults
# `imaging.quality` was deprecated in Hugo v0.163.0 in favour of per-format
# settings; the global key is slated for removal in a future release.
imaging:
  jpeg:
    quality: 85
  webp:
    quality: 85
  avif:
    quality: 85
  resampleFilter: lanczos
  anchor: smart